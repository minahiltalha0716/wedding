<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey | Private Gallery</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-pink: #f06292;
            --text-dark: #4a4a4a;
            --soft-white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--soft-white);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Password Overlay */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(135deg, #fce4ec 0%, #ffffff 100%);
            transition: opacity 0.5s ease;
        }

        .auth-card {
            text-align: center;
            padding: 2rem;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid var(--accent-pink);
            border-radius: 25px;
            margin-top: 10px;
            text-align: center;
            outline: none;
        }

        button {
            padding: 10px 25px;
            background: var(--accent-pink);
            color: white;
            border: none;
            border-radius: 25px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Gallery Layout */
        .header {
            text-align: center;
            padding: 80px 20px;
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 4rem; color: var(--accent-pink); margin-bottom: 10px; }

        .timeline {
            position: relative;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background: var(--primary-pink);
            top: 0; bottom: 0; left: 50%;
            margin-left: -1px;
            z-index: -1;
        }

        .story-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 100px;
        }

        .story-item:nth-child(even) { flex-direction: row-reverse; }

        .story-img {
            width: 45%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .story-img:hover { transform: scale(1.05); }

        .story-content {
            width: 45%;
            padding: 20px;
        }

        .story-content h3 { 
            font-family: 'Dancing Script', cursive; 
            font-size: 2.5rem; 
            color: var(--accent-pink); 
            margin: 0;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Simple Password Protection -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Welcome to our Private Moments</h2>
            <p>Please enter the secret password</p>
            <input type="password" id="password-input" placeholder="Password...">
            <br><button onclick="checkPassword()">Enter Our World</button>
            <p id="error-msg" style="color: red; display: none;">Wrong password, try again!</p>
        </div>
    </div>

    <!-- Gallery Content -->
    <div id="gallery-content" class="hidden">
        <div class="header" data-aos="fade-up">
            <h1>Our Story</h1>
            <p>Every moment spent with you is a beautiful dream come true.</p>
        </div>

        <div class="timeline" id="dynamic-timeline"></div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        // Note: The REAL_HASH is replaced during deployment via GitHub Actions
        const VALID_HASH = "e8bd4004982d26e8d603429d5a6f22dbc7e6eae4dff636aef476091d3fcc4666"; 

        async function hashPassword(password) {
            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function formatTitle(text) {
            return text.replace(/[_-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        async function renderGallery() {
            try {
                const response = await fetch('gallery-manifest.json');
                const categories = await response.json();
                const timeline = document.getElementById('dynamic-timeline');
                
                let html = '';
                categories.forEach((cat, index) => {
                    const side = index % 2 === 0 ? 'fade-right' : 'fade-left';
                    const categoryTitle = formatTitle(cat.category);
                    
                    cat.images.forEach(img => {
                        html += `
                            <div class="story-item" data-aos="${side}">
                                <img src="images/${cat.category}/${img}" alt="${categoryTitle}" class="story-img">
                                <div class="story-content">
                                    <h3>${categoryTitle}</h3>
                                    <p>A beautiful moment from our ${categoryTitle} event.</p>
                                </div>
                            </div>
                        `;
                    });
                });
                
                timeline.innerHTML = html;
                // Re-initialize AOS after content is injected
                AOS.init({ duration: 1000, once: true });
            } catch (err) {
                console.error("Failed to load gallery manifest", err);
            }
        }

        async function checkPassword() {
            const input = document.getElementById('password-input').value;
            const hashedInput = await hashPassword(input);
            
            if (hashedInput === VALID_HASH) {
                document.getElementById('auth-overlay').style.opacity = '0';
                setTimeout(async () => {
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('gallery-content').classList.remove('hidden');
                    await renderGallery();
                }, 500);
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
