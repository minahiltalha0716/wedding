<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey | Private Gallery</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-pink: #f06292;
            --text-dark: #4a4a4a;
            --soft-white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--soft-white);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Password Overlay */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(135deg, #fce4ec 0%, #ffffff 100%);
            transition: opacity 0.5s ease;
        }

        .auth-card {
            text-align: center;
            padding: 2rem;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid var(--accent-pink);
            border-radius: 25px;
            margin-top: 10px;
            text-align: center;
            outline: none;
        }

        button {
            padding: 10px 25px;
            background: var(--accent-pink);
            color: white;
            border: none;
            border-radius: 25px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Gallery Layout */
        .header {
            text-align: center;
            padding: 80px 20px;
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 4rem; color: var(--accent-pink); margin-bottom: 10px; }

        .timeline {
            position: relative;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background: var(--primary-pink);
            top: 0; bottom: 0; left: 50%;
            margin-left: -1px;
            z-index: -1;
        }

        .story-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 100px;
        }

        .story-item:nth-child(even) { flex-direction: row-reverse; }

        /* Carousel Styles */
        .carousel-container {
            width: 45%;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.8s cubic-bezier(0.45, 0, 0.55, 1);
            width: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            flex-shrink: 0;
        }

        .story-img {
            width: 100%;
            display: block;
            transition: transform 0.3s;
        }

        .story-content {
            width: 45%;
            padding: 20px;
        }

        .story-content h3 { 
            font-family: 'Dancing Script', cursive; 
            font-size: 2.5rem; 
            color: var(--accent-pink); 
            margin: 0;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Simple Password Protection -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Welcome to our Private Moments</h2>
            <p>Please enter the secret password</p>
            <input type="password" id="password-input" placeholder="Password...">
            <br><button onclick="checkPassword()">Enter Our World</button>
            <p id="loading-msg" style="display: none; color: var(--accent-pink);">Unlocking our memories...</p>
            <p id="error-msg" style="color: red; display: none;">Wrong password, try again!</p>
        </div>
    </div>

    <!-- Gallery Content -->
    <div id="gallery-content" class="hidden">
        <div class="header" data-aos="fade-up">
            <h1>Our Story</h1>
            <p>Every moment spent with you is a beautiful dream come true.</p>
        </div>

        <div class="timeline" id="dynamic-timeline"></div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        // Note: The REAL_HASH is replaced during deployment via GitHub Actions
        const VALID_HASH = "e8bd4004982d26e8d603429d5a6f22dbc7e6eae4dff636aef476091d3fcc4666"; 

        async function hashPassword(password) {
            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function formatTitle(text) {
            return text.replace(/[_-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function initCarousels() {
            const tracks = document.querySelectorAll('.carousel-track');
            tracks.forEach(track => {
                let index = 0;
                const slides = track.querySelectorAll('.carousel-slide');
                if (slides.length <= 1) return;

                setInterval(() => {
                    index = (index + 1) % slides.length;
                    track.style.transform = `translateX(-${index * 100}%)`;
                }, 3500); // Scroll every 3.5 seconds
            });
        }

        async function renderGallery(password) {
            try {
                const response = await fetch('assets/gallery-manifest.json');
                const encryptedBox = await response.json();
                
                // Decrypt the data using the provided password
                const key = CryptoJS.SHA256(password);
                const iv = CryptoJS.enc.Hex.parse('00000000000000000000000000000000');
                
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: CryptoJS.enc.Hex.parse(encryptedBox.data) },
                    key,
                    { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                );
                
                let rawJson;
                try {
                    rawJson = decrypted.toString(CryptoJS.enc.Utf8);
                    if (!rawJson) throw new Error("Empty decryption result");
                } catch (e) {
                    console.error("UTF-8 Decoding Error:", e);
                    throw new Error("Failed to decrypt data. The key derived from the password might be incorrect.");
                }
                
                const categories = JSON.parse(rawJson);
                const timeline = document.getElementById('dynamic-timeline');
                
                let html = '';
                categories.forEach((cat, index) => {
                    const side = index % 2 === 0 ? 'fade-right' : 'fade-left';
                    const categoryTitle = formatTitle(cat.category);

                    html += `
                        <div class="story-item" data-aos="${side}">
                            <div class="carousel-container">
                                <div class="carousel-track">
                                    ${cat.images.map(base64Data => `
                                        <div class="carousel-slide">
                                            <img src="${base64Data}" alt="${categoryTitle}" class="story-img">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="story-content">
                                <h3>${categoryTitle}</h3>
                                <p>Capturing the magic of our ${categoryTitle}. Each photo tells a part of our beautiful journey together.</p>
                            </div>
                        </div>
                    `;
                });
                
                timeline.innerHTML = html;
                initCarousels();
                // Re-initialize AOS after content is injected
                AOS.init({ duration: 1000, once: true });
            } catch (err) {
                console.error("Failed to load gallery manifest", err);
            }
        }

        async function checkPassword() {
            const input = document.getElementById('password-input').value;
            const hashedInput = await hashPassword(input);
            
            if (hashedInput === VALID_HASH) {
                document.getElementById('error-msg').style.display = 'none';
                document.getElementById('loading-msg').style.display = 'block';
                
                setTimeout(async () => {
                    await renderGallery(input);
                    document.getElementById('auth-overlay').style.opacity = '0';
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('gallery-content').classList.remove('hidden');
                    document.getElementById('password-input').value = ''; // Clear password from memory
                }, 500);
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('loading-msg').style.display = 'none';
            }
        }
    </script>
</body>
</html>
