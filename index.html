<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minahil & Talha Wedding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/invitation.css">
    <style>
        .event-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .event-link-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: var(--accent-black);
            transition: transform 0.3s ease;
            text-align: center;
        }
        .event-link-card:hover {
            transform: translateY(-5px);
        }
        .event-link-card h4 {
            color: var(--accent-red);
            margin-bottom: 10px;
            font-family: "Great Vibes", cursive;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title" style="font-family: 'Great Vibes', cursive; font-size: 3rem;">Minahil & Talha</h1>
            <p class="subtitle">Welcome to our wedding celebration</p>
        </div>
    </header>

    <main>
        <section class="hero" style="background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center;">
            <div class="overlay">
                <div class="container hero-content">
                    <h2 style="font-family: 'Great Vibes', cursive; font-size: 4rem;">Save The Date</h2>
                    <p class="date" style="font-size: 1.5rem; letter-spacing: 2px;">DECEMBER 2024</p>
                </div>
            </div>
        </section>

        <section class="container" style="text-align: center; padding: 60px 20px;">
            <h3 class="section-title">Our Events</h3>
            <div class="event-links">
                <a href="mayoun.html" class="event-link-card">
                    <h4>Mayoun</h4>
                    <p>Dec 10, 2024</p>
                </a>
                <a href="mehndi.html" class="event-link-card">
                    <h4>Mehndi</h4>
                    <p>Dec 12, 2024</p>
                </a>
                <a href="wedding.html" class="event-link-card">
                    <h4>Wedding</h4>
                    <p>Dec 14, 2024</p>
                </a>
                <a href="private.html" class="event-link-card">
                    <h4>Gallery</h4>
                    <p>Private Photos</p>
                </a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">Made with ❤️ for Minahil & Talha</div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
